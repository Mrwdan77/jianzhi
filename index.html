<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周末兼职 · 大学生兼职撮合平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 内联 SVG 图标库（file:// 下跨文件 sprite 不可用，必须内联） -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></symbol>
  <symbol id="icon-store" viewBox="0 0 24 24"><path d="M4 9l1.2-4.5h13.6L20 9"/><path d="M4 9v10.5h16V9"/><path d="M9 19.5v-5.5h6v5.5"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 14.5-6.9L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-14.5 6.9L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
</svg>

<!-- 存储不可用警告条 -->
<div id="storage-warning" class="storage-warning" hidden>本地存储不可用：报名、发布、档案等改动刷新后会丢失，请检查浏览器隐私设置</div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/student/jobs">
      <span class="brand-logo" aria-hidden="true">周</span>
      <span class="brand-text">
        <span class="brand-name">周末兼职</span>
        <span class="brand-sub">大学生 × 周边商家</span>
      </span>
    </a>
    <nav class="role-switch" aria-label="角色切换">
      <a href="#/student/jobs" class="role-btn" id="role-btn-student">🎓 学生</a>
      <a href="#/merchant/manage" class="role-btn" id="role-btn-merchant">🏪 商家</a>
    </nav>
    <button class="ghost-btn" id="btn-reset" type="button" title="清空本地数据并恢复演示数据">
      <svg class="icon"><use href="#icon-refresh"/></svg><span class="ghost-btn-text">重置演示数据</span>
    </button>
  </div>
  <nav class="subnav" id="subnav" aria-label="栏目导航"></nav>
</header>

<main id="view-root" class="view-root"></main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/mock-data.js"></script>
<script src="js/store.js"></script>
<script src="js/match.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>JZ.App.init();</script>
</body>
</html>
